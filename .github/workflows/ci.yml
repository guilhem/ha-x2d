name: Software and firmware checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: X2D core and dongle MySensors protocol
        run: |
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native -j2
          ctest --test-dir build/native --output-on-failure
      - name: RP2040 digital output and capture checks
        run: |
          mkdir -p build/firmware-check/include
          curl -fL https://github.com/bblanchon/ArduinoJson/releases/download/v7.4.3/ArduinoJson-v7.4.3.h -o build/firmware-check/include/ArduinoJson.h
          echo 'ab5fbb8268b846b5f4bc5a5fee11bb2c96f7b8b846f5bef6540afb6a9cc76a5b  build/firmware-check/include/ArduinoJson.h' | sha256sum -c -
          g++ -std=c++17 -Wall -Wextra -Werror -Ilib/x2d-core/src firmware/check_radio_tx.cpp -o build/check-radio
          build/check-radio
          g++ -std=c++17 -Wall -Wextra -Werror -Ilib/x2d-core/src firmware/tx_check/check_capture.cpp -o build/check-capture
          build/check-capture
          g++ -std=c++17 -Wall -Wextra -Werror -Ilib/x2d-core/src -Ibuild/firmware-check/include firmware/check_rx_debug.cpp -o build/check-rx
          build/check-rx
      - name: Native HA and pymysensors over PTY, frontend contract, passive decoder
        run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python tools/check_uf2_layout.py

  rp2040:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [default, rx-debug, tx-check]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1
      - name: Compile and verify journal protection
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          sketch=ha_x2d
          case "$PROFILE" in
            rx-debug) sketch=rx_debug ;;
            tx-check) sketch=tx_check ;;
          esac
          python tools/build_firmware.py "$sketch" --output-dir build/firmware
          # Builds and simulated checks do not qualify the public RF candidate.

  esphome:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: guilhem/esphome-x2d
          ref: 6f874e43fb9644e38f5c63590499ede55ef80a70
          path: build/esphome-x2d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r build/esphome-x2d/requirements-dev.txt
      - name: Shared controller and ESPHome regression checks
        run: |
          cmake -S build/esphome-x2d -B build/esphome-checks -DX2D_CORE_DIR="$PWD/lib/x2d-core"
          cmake --build build/esphome-checks -j2
          ctest --test-dir build/esphome-checks --output-on-failure
          cd build/esphome-x2d
          python -m unittest discover -s tests -p 'test_*.py' -v
          esphome config examples/esp32-s3.yaml
          esphome compile examples/esp32-s3.yaml
