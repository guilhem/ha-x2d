[project]
name = "ha-x2d-dev"
version = "0.1.0"
requires-python = ">=3.14.2,<3.15"

[dependency-groups]
dev = [
    "pymysensors==0.26.0",
    "paho-mqtt==2.1.0",  # HA imports its MQTT module even for serial MySensors.
    "serialx==1.10.0",  # Passive RX capture tool.
    "homeassistant==2026.9.4",
    "aiousbwatcher==1.1.2",
    "aiohasupervisor==0.6.0",
    "home-assistant-frontend==20260826.7",
]

[tool.uv]
package = false
